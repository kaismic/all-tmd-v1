[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "all-tmd-classifier"
version = "0.1.0"
description = "Extensible multi-source transport-mode classifier pipeline."
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.5.0",
  "pandas>=2.3.3,<3",
  "pyarrow>=24.0.0",
  "numpy>=2.5.1",
  "scipy>=1.18.0",
  "scikit-learn>=1.9.0",
  "xgboost>=3.3.0",
  "optuna>=4.9.0",
  "mlflow>=3.14.0",
  "matplotlib>=3.10.0",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
test = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
